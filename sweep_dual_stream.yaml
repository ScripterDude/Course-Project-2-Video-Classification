# .\venv\Scripts\wandb.exe sweep --project idlcv-project2 sweep_dual_stream.yaml
# wandb agent dtu_hcai/idlcv-project2/n0uzxa4w

program: src/train_dualstream_flow.py
method: bayes
run_cap: 10
metric:
  name: best_fused_val_accuracy
  goal: maximize

parameters:
  seed:
    value: 0

  phase:
    value: search

  batch_size:
    value: 32

  flow_bound:
    value: 28.0

  rgb_learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0001

  flow_learning_rate:
    distribution: log_uniform_values
    min: 0.00003
    max: 0.0003

  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001

command:
  - venv/Scripts/python.exe
  - "-u"
  - ${program}