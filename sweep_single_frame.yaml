# .\venv\Scripts\wandb.exe sweep --project idlcv-project2 sweep_single_frame.yaml
# wandb agent dtu_hcai/idlcv-project2/pbltrgk4
program: src/train_single_frame.py
method: bayes
run_cap: 10

metric:
  name: best_val_video_accuracy
  goal: maximize

parameters:
  seed:
    value: 0
  phase:
    value: search
  batch_size:
    value: 32
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.0001
  weight_decay:
    distribution: log_uniform_values
    min: 0.000001
    max: 0.001

command:
  - venv/Scripts/python.exe
  - "-u"
  - ${program}